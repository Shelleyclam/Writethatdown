[workspace]
# The desktop app shares one target folder with the core crate, so whisper.cpp
# is only compiled once.
members = [".", "app/src-tauri"]

[package]
name = "whisperflow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cpal = "0.18"
hound = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
